<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pricewatch — price drop detector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="topbar">
    <div class="wordmark">
      <span class="dot" id="statusDot"></span>
      Pricewatch
    </div>
    <div class="topbar-right">
      <span class="session-email" id="sessionEmail"></span>
      <button class="btn btn-ghost" id="logoutBtn" hidden>Sign out</button>
    </div>
  </header>

  <main class="app">

    <!-- AUTH VIEW -->
    <section id="authView" class="auth-view">
      <div class="auth-card">
        <h1>Catch the drop.</h1>
        <p class="auth-sub">Track prices on anything you're waiting to buy, and know the moment it hits your number.</p>

        <div class="tabs">
          <button class="tab active" data-tab="login">Sign in</button>
          <button class="tab" data-tab="register">Create account</button>
        </div>

        <form id="loginForm" class="form">
          <label>Email
            <input type="email" name="email" required autocomplete="email" />
          </label>
          <label>Password
            <input type="password" name="password" required autocomplete="current-password" />
          </label>
          <button type="submit" class="btn btn-primary">Sign in</button>
          <p class="form-error" id="loginError"></p>
        </form>

        <form id="registerForm" class="form" hidden>
          <label>Email
            <input type="email" name="email" required autocomplete="email" />
          </label>
          <label>Password
            <input type="password" name="password" required minlength="8" autocomplete="new-password" />
          </label>
          <p class="form-hint">At least 8 characters.</p>
          <button type="submit" class="btn btn-primary">Create account</button>
          <p class="form-error" id="registerError"></p>
        </form>
      </div>
    </section>

    <!-- DASHBOARD VIEW -->
    <section id="dashboardView" class="dashboard" hidden>

      <aside class="panel add-panel">
        <h2>Track a new price</h2>
        <form id="addProductForm" class="form">
          <label>Item name
            <input type="text" name="name" placeholder="e.g. Sony WH-1000XM5" required />
          </label>
          <label>Link <span class="optional">optional</span>
            <input type="url" name="url" placeholder="https://…" />
          </label>
          <div class="form-row">
            <label>Current price
              <input type="number" name="currentPrice" step="0.01" min="0" required />
            </label>
            <label>Alert at or below
              <input type="number" name="targetPrice" step="0.01" min="0" required />
            </label>
          </div>
          <button type="submit" class="btn btn-primary">Start tracking</button>
          <p class="form-error" id="addProductError"></p>
        </form>
      </aside>

      <div class="panel list-panel">
        <div class="list-header">
          <h2>Watched items</h2>
          <span class="count" id="itemCount">0</span>
        </div>
        <div id="emptyState" class="empty-state" hidden>
          Nothing tracked yet. Add an item on the left to start watching its price.
        </div>
        <ul id="productList" class="product-list"></ul>
      </div>

    </section>

  </main>

  <!-- LOG PRICE MODAL -->
  <div id="priceModal" class="modal-backdrop" hidden>
    <div class="modal">
      <h3>Log a new price check</h3>
      <p class="modal-sub" id="priceModalItemName"></p>
      <form id="priceForm" class="form">
        <label>Observed price
          <input type="number" name="price" step="0.01" min="0" required />
        </label>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="priceModalCancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Log price</button>
        </div>
        <p class="form-error" id="priceModalError"></p>
      </form>
      <div class="history-block">
        <h4>History</h4>
        <ul id="historyList" class="history-list"></ul>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
